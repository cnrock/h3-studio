# ============================================================
# H3 Studio — K8s 部署：Service
#  - ClusterIP：集群内访问 / 配合 Ingress
#  - 另附 NodePort 供无 Ingress 时直接暴露（按需保留）
# 注意：长视频生成可能跑 30 分钟，若前面套 Ingress/Nginx，
#       务必把 proxy_read_timeout 放宽（见 07-ingress.yaml 注释）。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: h3-studio
  namespace: h3-studio
  labels:
    app: h3-studio
spec:
  type: ClusterIP
  selector:
    app: h3-studio
  ports:
    - name: http
      port: 8787
      targetPort: http
      protocol: TCP
---
# 可选：无 Ingress 时用 NodePort 直接暴露
apiVersion: v1
kind: Service
metadata:
  name: h3-studio-nodeport
  namespace: h3-studio
  labels:
    app: h3-studio
spec:
  type: NodePort
  selector:
    app: h3-studio
  ports:
    - name: http
      port: 8787
      targetPort: http
      nodePort: 30787
      protocol: TCP
