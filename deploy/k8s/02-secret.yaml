# ============================================================
# H3 Studio — K8s 部署：Secret（敏感项）
#
# ⚠️ 不要提交真实密钥到 Git。两种方式：
#   1) 直接改本文件（仅限本地/私有仓库）
#   2) 用 kubectl 创建后忽略本文件：
#      kubectl -n h3-studio create secret generic h3-studio-secret \
#        --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#        --from-literal=SMTP_PASS="你的SMTP授权密码" \
#        --from-literal=H3_API_KEY="" \
#        --from-literal=LLM_API_KEY=""
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: h3-studio-secret
  namespace: h3-studio
type: Opaque
stringData:
  # 会话签名密钥：务必换成足够长的随机串，例如 openssl rand -hex 32
  JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_STRING"
  # SMTP 授权密码
  SMTP_PASS: "REPLACE_WITH_SMTP_PASSWORD"
  # H3 接口鉴权 Key（若后端需要；不需要则留空）
  H3_API_KEY: ""
  # ref2va 专用后端的 Key（留空则复用 H3_API_KEY）
  H3_REF2VA_API_KEY: ""
  # 提示词助手（v1.9）的 Key。指向需要鉴权的端点（如云端网关）时填；
  # 指向同集群内不带 --api-key 的自建 vLLM 时可留空（空则不发 Authorization 头）。
  LLM_API_KEY: ""
