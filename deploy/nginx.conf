# H3 Studio —— 公网 VPS 部署用 Nginx 反代示例
# 放到 /etc/nginx/conf.d/h3-studio.conf，改好域名与证书路径后 nginx -t && systemctl reload nginx
#
# 说明：
#  - 网站本身只监听 127.0.0.1:8787（见 env.vps.example 的 HOST/PORT）
#  - 视频生成可能很慢，proxy_read_timeout 要放宽到 30 分钟以上
#  - 生成请求体上限设为 64m（H3 对整包的限制）

server {
    listen 80;
    server_name your-domain.com;
    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # 上传参考素材 + 生成结果的体积上限
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 视频生成是长阻塞请求，务必放宽超时
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
    }
}
